<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTOADESIVOS • FAJARDOGAMES</title>
  
  <!-- INSTANT REDIRECT -->
  <meta http-equiv="refresh" content="0; url=fajardogames.html" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%), linear-gradient(180deg, #11141a 0%, #0b0d12 100%);
      font-family: Inter, system-ui, sans-serif;
      color: #f5f7fb;
      text-align: center;
    }
    .container {
      max-width: 420px;
    }
    h1 {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: -2px;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p.small {
      margin: 0;
      font-size: 1.1rem;
      color: #8a9ab7;
      letter-spacing: 3px;
      font-weight: 500;
    }
    .loading {
      margin-top: 40px;
      font-size: 15px;
      color: #4fd1ff;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #33425f;
      border-top-color: #4fd1ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <p class="small">CATÁLOGO</p>
    <h1>FAJARDOGAMES</h1>
    <div class="loading">
      <div class="spinner"></div><br>
      Redirecionando para o catálogo...
    </div>
  </div>
  <script>
    setTimeout(() => {
      window.location.href = "fajardogames.html";
    }, 300);
  </script>
</body>
</html>
