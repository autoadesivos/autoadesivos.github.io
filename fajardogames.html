<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos | AUTOADESIVOS</title>
  <meta name="description" content="Catálogo visual AUTOADESIVOS: toque em uma miniatura para ver o produto ampliado e comprar no marketplace." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="AUTO ADESIVOS" />
  <link rel="canonical" href="https://www.autoadesivos.com/paginacustomizada.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AUTOADESIVOS | Catálogo de Produtos" />
  <meta property="og:description" content="Miniaturas de produtos com visualização ampliada e botão de compra." />
  <meta property="og:url" content="https://www.autoadesivos.com/paginacustomizada.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --card: #171a21;
      --text: #f5f7fb;
      --muted: #aeb6c5;
      --border: #2a3040;
      --hover: #202635;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      --accent: #4fd1ff;
      --buy: #00d46a;
      --buy-hover: #00f27a;
      --viewport-gap: 24px;
      --tile-radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--viewport-gap);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%), linear-gradient(180deg, #11141a 0%, #0b0d12 100%);
      color: var(--text);
    }

    body.modal-open {
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      height: min(920px, calc(100dvh - (var(--viewport-gap) * 2)));
      background: rgba(23, 26, 33, 0.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .catalog-panel {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      padding: 22px 18px 24px;
    }

    .catalog-panel::-webkit-scrollbar { display: none; }

    .catalog-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .catalog-header p {
      margin: 0 0 6px 0;
      font-size: 1.05rem;
      color: #8a9ab7;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .catalog-header h1 {
      margin: 0;
      font-size: 3.1rem;
      line-height: 1;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: -1.2px;
    }

    .catalog-hint {
      margin: 0 0 20px;
      text-align: center;
      color: #aeb9d2;
      font-size: 13px;
      line-height: 1.45;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .catalog-grid.loaded { opacity: 1; }

    .product-tile {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 0;
      border: 1px solid #33425f;
      border-radius: var(--tile-radius);
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }

    .product-tile:hover,
    .product-tile:focus-visible {
      transform: translateY(-2px);
      border-color: #5f739d;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
      outline: none;
    }

    .product-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
      transition: transform 0.22s ease, filter 0.22s ease;
      image-rendering: auto;
      -webkit-image-rendering: auto;
      -ms-interpolation-mode: bicubic;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      image-rendering: optimizeQuality;
    }

    .product-tile:hover img,
    .product-tile:focus-visible img {
      transform: scale(1.035);
      filter: brightness(1.08);
    }

    .tile-cue {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(174, 185, 210, 0.42);
      border-radius: 10px;
      background: rgba(15, 19, 27, 0.85);
      color: #e7edfb;
      font-size: 15px;
      line-height: 1;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(7px);
    }

    .modal.is-open {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(760px, 100%);
      max-height: calc(100dvh - 36px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      background: #10131a;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
      animation: modalIn 0.16s ease-out;
    }

    @keyframes modalIn {
      from {
        transform: scale(0.96);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      background: rgba(0,0,0,0.75);
      color: #ffffff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-close:hover,
    .modal-close:focus-visible {
      background: rgba(255,255,255,0.12);
      outline: none;
    }

    .modal-image-wrap {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #ffffff;
      overflow: hidden;
    }

    .modal-image {
      width: 100%;
      max-height: calc(100dvh - 180px);
      object-fit: contain;
      display: block;
      background: #ffffff;
    }

    .modal-buy {
      display: block;
      width: 100%;
      padding: 20px 18px;
      border-radius: 18px;
      background: var(--buy);
      color: #041008;
      text-align: center;
      text-decoration: none;
      font-size: clamp(1.45rem, 4vw, 2.45rem);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 1.5px;
      box-shadow: 0 14px 34px rgba(0, 212, 106, 0.28);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .modal-buy:hover,
    .modal-buy:focus-visible {
      background: var(--buy-hover);
      transform: translateY(-1px);
      box-shadow: 0 18px 42px rgba(0, 212, 106, 0.36);
      outline: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      :root { --viewport-gap: 16px; }

      .catalog-panel { padding: 20px 16px 22px; }

      .catalog-header h1 { font-size: 2.55rem; }

      .modal {
        padding: 10px;
      }

      .modal-box {
        padding: 10px;
        border-radius: 18px;
      }

      .modal-image {
        max-height: calc(100dvh - 150px);
      }

      .modal-buy {
        padding: 18px 14px;
      }
    }

    @media (min-width: 900px) {
      .card {
        max-width: 1120px;
        height: min(860px, calc(100dvh - (var(--viewport-gap) * 2)));
      }

      .catalog-panel { padding: 34px; }

      .catalog-grid {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 18px;
      }

      .product-tile { --tile-radius: 18px; }

      .tile-cue {
        right: 12px;
        bottom: 12px;
        width: 34px;
        height: 34px;
      }

      .catalog-header h1 { font-size: 3.7rem; }
    }

    @media (min-width: 1280px) {
      .card { max-width: 1240px; }

      .catalog-grid {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Catálogo de produtos AUTOADESIVOS">
    <section class="catalog-panel" aria-label="Miniaturas de produtos">

      <div class="catalog-header">
        <p>CATÁLOGO</p>
        <h1>FAJARDOGAMES</h1>
      </div>

      <p class="catalog-hint">
        Clique ou toque em uma miniatura para ver o produto ampliado.
      </p>

      <div class="catalog-grid" id="catalog-grid"></div>
    </section>
  </main>

  <div class="modal" id="product-modal" role="dialog" aria-modal="true" aria-label="Produto ampliado">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" type="button" aria-label="Fechar">×</button>

      <div class="modal-image-wrap">
        <img class="modal-image" id="modal-image" src="" alt="Produto ampliado" />
      </div>

      <a class="modal-buy" id="modal-buy" href="#" target="_blank" rel="noopener noreferrer">
        COMPRAR
      </a>
    </div>
  </div>

  <script>
    const grid = document.getElementById("catalog-grid");

    const modal = document.getElementById("product-modal");
    const modalImage = document.getElementById("modal-image");
    const modalBuy = document.getElementById("modal-buy");
    const modalClose = document.getElementById("modal-close");

    const folder = "images/products/FAJARDOGAMES";
    const marketplaceBase = "https://marketplace.example/produto";
    const maxScan = 500;

    let lastFocusedElement = null;

    function shuffle(array) {
      const arr = [...array];

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    function checkImageExists(src) {
      return new Promise(resolve => {
        const img = new Image();

        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = src;
      });
    }

    function openProductModal(index, imgSrc) {
      lastFocusedElement = document.activeElement;

      modalImage.src = imgSrc;
      modalImage.alt = `Produto ${index} ampliado`;
      modalBuy.href = `${marketplaceBase}/${index}`;

      modal.classList.add("is-open");
      document.body.classList.add("modal-open");

      modalClose.focus();
    }

    function closeProductModal() {
      modal.classList.remove("is-open");
      document.body.classList.remove("modal-open");

      modalImage.src = "";
      modalBuy.href = "#";

      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }

    function createProductTile(index, imgSrc) {
      const button = document.createElement("button");
      button.className = "product-tile";
      button.type = "button";
      button.setAttribute("aria-label", "Ver produto ampliado");
      button.addEventListener("click", () => openProductModal(index, imgSrc));

      const img = document.createElement("img");
      img.src = imgSrc;
      img.alt = "";
      img.loading = index < 12 ? "eager" : "lazy";
      img.decoding = "async";

      const cue = document.createElement("span");
      cue.className = "tile-cue";
      cue.setAttribute("aria-hidden", "true");
      cue.textContent = "🔍";

      const sr = document.createElement("span");
      sr.className = "sr-only";
      sr.textContent = "Ver produto ampliado";

      button.append(img, cue, sr);
      return button;
    }

    async function loadCatalog() {
      grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#8a9ab7;font-size:15px;">🔄 Carregando e embaralhando catálogo...</p>`;

      const checks = Array.from({ length: maxScan }, (_, i) => {
        const src = `${folder}/${i}.png`;
        return checkImageExists(src).then(exists => ({ index: i, src, exists }));
      });

      const results = await Promise.all(checks);
      let valid = results.filter(r => r.exists);

      if (valid.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:80px;color:#777;">Nenhum produto encontrado.</p>`;
        return;
      }

      valid = shuffle(valid);
      grid.innerHTML = "";

      const fragment = document.createDocumentFragment();

      valid.forEach(({ index, src }) => {
        fragment.appendChild(createProductTile(index, src));
      });

      grid.appendChild(fragment);
      grid.classList.add("loaded");
    }

    modalClose.addEventListener("click", closeProductModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeProductModal();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeProductModal();
      }
    });

    loadCatalog();
  </script>
</body>
</html>
