<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos | AUTOADESIVOS</title>
  <meta name="description" content="Catálogo visual AUTOADESIVOS: toque em uma miniatura para ver o produto ampliado e comprar no marketplace." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="AUTO ADESIVOS" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests;" />
  <link rel="canonical" href="https://www.autoadesivos.com/paginacustomizada.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AUTOADESIVOS | Catálogo de Produtos" />
  <meta property="og:description" content="Miniaturas de produtos com visualização ampliada e botão de compra." />
  <meta property="og:url" content="https://www.autoadesivos.com/paginacustomizada.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="fajardogames.css" />
</head>
<body>
  <main class="card" aria-label="Catálogo de produtos AUTOADESIVOS">
    <section class="catalog-panel" aria-label="Miniaturas de produtos">

      <div class="catalog-header">
        <p>CATÁLOGO</p>
        <h1>FAJARDOGAMES</h1>
      </div>

      <p class="catalog-hint">
        Clique ou toque em uma miniatura para ver o produto ampliado.
      </p>

      <div class="catalog-grid" id="catalog-grid"></div>
    </section>
  </main>

  <div class="modal" id="product-modal" role="dialog" aria-modal="true" aria-label="Produto ampliado">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" type="button" aria-label="Fechar">×</button>

      <div class="modal-image-wrap">
        <button class="modal-nav prev" id="modal-prev" type="button" aria-label="Imagem anterior">&lsaquo;</button>
        <img class="modal-image" id="modal-image" src="" alt="Produto ampliado" />
        <button class="modal-nav next" id="modal-next" type="button" aria-label="Proxima imagem">&rsaquo;</button>
      </div>

      <div class="modal-caption" id="modal-caption"></div>
      <div class="modal-size-track" id="modal-size-track" aria-label="Tamanhos disponiveis"></div>
      <div class="modal-color-track" id="modal-color-track" aria-label="Cores disponiveis"></div>

      <a class="modal-buy" id="modal-buy" href="#" target="_blank" rel="noopener noreferrer">
        COMPRAR
      </a>
    </div>
  </div>
  <script src="fajardogames.js" defer></script>
</body>
</html>
